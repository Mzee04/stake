[workspace]

[package]
name = "stake"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Stake: a commitment contract on Tari Ootle. Lock funds against a private goal; a referee you trust rules."

[dependencies]
tari_template_lib = "0.35"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
